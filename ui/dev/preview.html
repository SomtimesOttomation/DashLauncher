<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>DashLauncher preview</title>
  <style>
    html, body { margin: 0; height: 100%; }
    body { display: flex; background: #888; }
    iframe { border: 0; height: 100%; }
    body.glass { background: radial-gradient(60% 70% at 15% 20%,#2f7cff,transparent 60%),radial-gradient(50% 60% at 85% 30%,#ff5a8a,transparent 60%),radial-gradient(60% 60% at 60% 95%,#18c29c,transparent 60%),#1a1f3a; }
    #rail { width: 76px; flex: none; }
    #main { flex: 1; }
  </style>
</head>
<body>
  <!-- Dev only: the rail beside the notice page, both with the mock host. preview.html?theme=dark#error -->
  <iframe id="rail" title="rail"></iframe>
  <iframe id="main" title="notice"></iframe>
  <script>
    const q = location.search;
    document.getElementById('rail').src = '../rail.html' + q;
    document.getElementById('main').src = '../panel.html' + q + (location.hash || '#locked');
  </script>
<script>
  if (/[?&]glass/.test(location.search)) document.body.classList.add('glass');
  // a frame whose colour scheme differs from this page's gets an opaque background in Chromium: match them
  if (/[?&]theme=dark/.test(location.search)) document.documentElement.style.colorScheme = 'dark';
</script>
</body>
</html>
